[project]
name = "mace-materials-pipeline"
version = "0.1.0"
description = "DIMER pipeline for MACE-MP-0b2 small (mace-foundations/mace-mp-0): energy, force and stress prediction for atomic structures and bounded fine-tuning of the foundation interatomic potential"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  # The upstream `.model` asset is a pickled torch module; this package never serves it. It is statically
  # audited, converted once into a JSON config + safetensors pair, and rebuilt from the installed mace-torch
  # (docs/WEIGHTS.md). mace-torch pins e3nn==0.4.4 itself and brings ase, opt_einsum and the rest.
  "torch==2.14.0",
  # mace-torch imports torchmetrics, which imports torchvision when one is installed; hosted images ship a
  # torchvision built for their own torch, so the matching build is pinned beside torch (ABI: torchvision::nms).
  "torchvision==0.29.0",
  "mace-torch==0.3.16",
  "e3nn==0.4.4",
  "ase==3.29.0",
  "numpy==2.5.3",
  "safetensors==0.8.0",
  "huggingface-hub==1.32.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/mace_materials_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tutorials"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
